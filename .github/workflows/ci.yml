name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy approute

      - name: Test
        run: pytest --tb=short -q --junitxml=pytest-report.xml

      - name: Guard - tests ran, zero skipped (K3 close-out p.1)
        run: |
          python3 - <<'PYEOF'
          import sys, xml.etree.ElementTree as ET
          try:
              root = ET.parse("pytest-report.xml").getroot()
          except Exception as exc:
              sys.exit(f"K3-GUARD FAIL: cannot read pytest-report.xml: {exc}")
          suites = list(root.iter("testsuite"))
          tests = sum(int(s.get("tests") or 0) for s in suites)
          errors = sum(int(s.get("errors") or 0) for s in suites)
          skips = []
          for tc in root.iter("testcase"):
              for sk in tc.findall("skipped"):
                  if sk.get("type") != "pytest.xfail":
                      skips.append(f"{tc.get('classname')}::{tc.get('name')} :: {sk.get('message')}")
          print(f"K3-GUARD: suites={len(suites)} tests={tests} errors={errors} skipped={len(skips)}")
          for s in skips[:100]:
              print("  SKIPPED:", s)
          if not suites or tests == 0:
              sys.exit("K3-GUARD FAIL: no tests ran (absent suite) - green must mean tests ran")
          if errors:
              sys.exit(f"K3-GUARD FAIL: {errors} collection errors")
          if skips:
              sys.exit(f"K3-GUARD FAIL: {len(skips)} skipped tests - skips forbidden in CI (K3 close-out p.1)")
          PYEOF

  golang:
    name: Go SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: golang
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Vet
        run: go vet ./...

      - name: Test
        # K3 close-out p.1: verbose + captured output so the guard can prove tests ran un-skipped.
        run: go test -race -count=1 -v ./... 2>&1 | tee go-tests.out; exit ${PIPESTATUS[0]}

      - name: Guard - tests ran, zero skipped (K3 close-out p.1)
        run: |
          [ -s go-tests.out ] || { echo "K3-GUARD FAIL: go-tests.out missing/empty"; exit 1; }
          if grep -- "--- SKIP" go-tests.out; then
            echo "K3-GUARD FAIL: skipped Go tests - skips forbidden in CI"; exit 1
          fi
          PASSED=$(grep -c -- "--- PASS: " go-tests.out || true)
          echo "K3-GUARD: passed=$PASSED"
          [ "$PASSED" -gt 0 ] || { echo "K3-GUARD FAIL: no Go tests ran"; exit 1; }

      - name: Benchmark
        run: go test -bench=. -benchmem -benchtime=1s ./... | tee /dev/null

  javascript:
    name: JS/TS SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: javascript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

  php:
    name: PHP SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Test
        run: vendor/bin/phpunit
